<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&amp;family=Noto+Sans+Devanagari:wght@300;600&amp;display=swap');
    </style>
  </defs>

  <!-- Devanagari mark -->
  <text x="10" y="78" font-family="'Noto Sans Devanagari', serif" font-size="72" font-weight="600" fill="#2a2a2a">अ</text>

  <!-- Divider line -->
  <line x1="72" y1="24" x2="72" y2="96" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Full Devanagari name -->
  <text x="88" y="58" font-family="'Noto Sans Devanagari', serif" font-size="36" font-weight="600" fill="#2a2a2a">अमलायम्</text>

  <!-- English transliteration -->
  <text x="89" y="82" font-family="'Inter', sans-serif" font-size="13" font-weight="300" fill="#999" letter-spacing="3">AMALAAYAM</text>

  <!-- Tagline -->
  <text x="89" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="300" fill="#bbb" letter-spacing="1.5">PURE ABODE</text>
</svg>
