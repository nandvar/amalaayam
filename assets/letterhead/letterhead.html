<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amalaayam — Letterhead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+Devanagari:wght@300;600&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #4a4a4a;
            background: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 0;
            background: #fff;
            position: relative;
        }

        /* --- Header --- */
        .header {
            padding: 36px 48px 28px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            border-bottom: 1px solid #e8e8e8;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-mark {
            font-family: 'Noto Sans Devanagari', serif;
            font-size: 48px;
            font-weight: 600;
            color: #2a2a2a;
            line-height: 1;
        }

        .header-divider {
            width: 1px;
            height: 44px;
            background: #e8e8e8;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-devanagari {
            font-family: 'Noto Sans Devanagari', serif;
            font-size: 24px;
            font-weight: 600;
            color: #2a2a2a;
            line-height: 1.2;
        }

        .header-english {
            font-size: 10px;
            font-weight: 300;
            color: #999;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header-right {
            text-align: right;
            font-size: 10px;
            font-weight: 300;
            color: #888;
            line-height: 1.8;
        }

        .header-right a {
            color: #888;
            text-decoration: none;
        }

        /* --- Accent stripe --- */
        .accent-stripe {
            height: 2px;
            background: linear-gradient(to right, #2a2a2a 0%, #2a2a2a 30%, transparent 100%);
        }

        /* --- Body content area --- */
        .body {
            padding: 48px 48px 80px;
            font-size: 11pt;
            font-weight: 300;
            line-height: 1.8;
            color: #4a4a4a;
            min-height: 700px;
        }

        .body p {
            margin-bottom: 12px;
        }

        /* --- Footer --- */
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 48px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-brand {
            font-family: 'Noto Sans Devanagari', serif;
            font-size: 14px;
            font-weight: 600;
            color: #2a2a2a;
        }

        .footer-info {
            font-size: 9px;
            font-weight: 300;
            color: #bbb;
            letter-spacing: 0.5px;
            text-align: right;
            line-height: 1.6;
        }

        @media print {
            body { background: #fff; }
            .page {
                margin: 0;
                box-shadow: none;
            }
        }

        @media screen {
            body {
                background: #f0f0f0;
                padding: 24px;
            }
            .page {
                box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="header-mark">अ</span>
                <div class="header-divider"></div>
                <div class="header-text">
                    <span class="header-devanagari">अमलायम्</span>
                    <span class="header-english">Amalaayam</span>
                </div>
            </div>
            <div class="header-right">
                B-3, Cloud Nine Cottages<br>
                Jail Road, Dhumaspur, Badshahpur<br>
                Gurgaon, Haryana 122101, India<br>
                <a href="https://amalaayam.com">amalaayam.com</a> &middot; <span class="placeholder">[PHONE NUMBER]</span>
            </div>
        </div>
        <div class="accent-stripe"></div>

        <!-- Body -->
        <div class="body">
            <p>[Your content here]</p>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="footer-brand">अमलायम्</span>
            <span class="footer-info">
                <span class="placeholder">[OWNER / ENTITY NAME]</span> &middot; B-3, Cloud Nine Cottages, Badshahpur, Gurgaon 122101 &middot; amalaayam.com
            </span>
        </div>
    </div>
</body>
</html>
